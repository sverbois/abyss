[buildout]
extends =
    base.cfg

extensions =
    mr.developer

auto-checkout =
    collective.contentsections

parts +=
    omelette

[sources]
collective.contentsections = git https://github.com/collective/collective.contentsections.git pushurl=git@github.com:collective/collective.contentsections.git branch=new-text-section

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}
